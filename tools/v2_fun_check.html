<!DOCTYPE html>
<html lang="ja">
<head><meta charset="UTF-8"><title>PK//PROTO v2 面白さ・偏り検証</title>
<style>
 body{font:12px/1.55 monospace;background:#101010;color:#0f0;padding:14px;white-space:pre-wrap}
 h1{color:#ffd400;font-size:13px}.bad{color:#ff5555}.warn{color:#ffaa00}
</style>
</head>
<body>
<h1>PK//PROTO v2 — おすすめの偏り／リズムの手触り／快感の具体性</h1>
<pre id="out">実行中...</pre>

<script src="../assets/v2/genres.js"></script>
<script src="../assets/v2/plan.js"></script>
<script src="../assets/v2/prompts.js"></script>
<script>
window.addEventListener('load', function(){
'use strict';
const L=[]; const log=(s)=>{ L.push(s); console.log(s); };
const out=document.getElementById('out');
const done=()=>{ out.textContent=L.join('\n'); };

/* ---------- A. おすすめの偏り ---------- */
log('=== A. おすすめの偏り（topPick 1位の分布） ===');
const EXP=['beginner','some','used'];

function distFor(selector){
  const d={}; let n=0;
  PK2.GAMES.forEach(gm=>{
    if(!selector(gm)) return;
    EXP.forEach(exp=>{
      const p = PK2.plan.topPick([gm.id], exp);
      if(!p) return;
      d[p.genre.id] = (d[p.genre.id]||0)+1; n++;
    });
  });
  return {d,n};
}
const show = (title, r)=>{
  const arr = Object.entries(r.d).sort((a,b)=> b[1]-a[1] || a[0].localeCompare(b[0]));
  log(title + '  n=' + r.n);
  log('  ' + arr.map(([k,v])=>k+':'+v+'('+(100*v/r.n).toFixed(1)+'%)').join('  '));
  return arr;
};

/* 全41本 × 3経験 */
const all = distFor(()=>true);
const arrAll = show('全ゲーム単独選択', all);

/* リズムと無関係なゲームだけ（＝偏りの本体） */
const nonRhythmGames = gm=> gm.genres.indexOf('g_rhythm')<0;
const nr = distFor(nonRhythmGames);
const arrNr = show('リズムと無関係なゲームだけ', nr);
log('  → リズムが1位になった件数=' + (nr.d.g_rhythm||0) + ' / ' + nr.n
    + ' (' + (100*(nr.d.g_rhythm||0)/nr.n).toFixed(1) + '%)');

/* リズムが好きなゲームに選ばれたとき（ここは偏ってよい） */
const rh = distFor(gm=> gm.genres.indexOf('g_rhythm')>=0);
log('リズム系のゲームを選んだとき  n=' + rh.n + ' → ' + Object.entries(rh.d).sort((a,b)=>b[1]-a[1]).map(([k,v])=>k+':'+v).join('  '));

/* 未選択 */
log('ゲーム未選択:');
EXP.forEach(exp=>{
  const p = PK2.plan.topPick([], exp);
  const top3 = PK2.plan.recommendGenres([], exp).slice(0,3).map(x=>x.genre.id).join(' > ');
  log('  exp=' + exp + ' → 1位=' + p.genre.id + '  top3=' + top3);
});

/* 上位3位以内に入る率 */
const inTop3 = {};
PK2.GAMES.forEach(gm=>{
  EXP.forEach(exp=>{
    const r = PK2.plan.recommendGenres([gm.id], exp).slice(0,3).map(x=>x.genre.id);
    r.forEach(id=>{ inTop3[id]=(inTop3[id]||0)+1; });
  });
});
log('top3入り回数(全123条件): ' + Object.entries(inTop3).sort((a,b)=>b[1]-a[1]).map(([k,v])=>k+':'+v).join('  '));

/* 1位の種類数（多様性） */
log('1位になったジャンル種類数=' + arrAll.length + ' / ' + PK2.GENRES.length);
log('1位になったことのないジャンル=' + PK2.GENRES.filter(g=>!all.d[g.id]).map(g=>g.id).join(',') || 'なし');

/* ---------- B. リズムゲームの手触り ---------- */
log('');
log('=== B. リズムゲームの中身 ===');
const gr = PK2.GENRES.find(g=>g.id==='g_rhythm');
['input','view','loop','why','unity','assets'].forEach(k=>{
  log('  ' + k + ' = ' + JSON.stringify(gr[k]));
});
const PR = PK2.plan.buildPlan({games:['g_taiko'], genre:'g_rhythm', hook:'h_pose', exp:'some', goal:'both'});
log('  pitch = ' + PR.pitch);
log('  show  = ' + PR.show);
log('  absurd.demand = ' + PR.absurd.demand);
log('  absurd.rescue = ' + PR.absurd.rescue);
const webR = PK2.prompts.promptWeb(PR);
log('  WEBの音セクション = ' + (webR.match(/【音[^\n]*】[\s\S]{0,220}/)||['(なし)'])[0].replace(/\n/g,' / '));
log('  WEBに「奏で」=' + /奏で/.test(webR) + ' 「楽器」=' + /楽器/.test(webR)
    + ' 「和音」=' + /和音/.test(webR) + ' 「メロディ」=' + /メロディ/.test(webR)
    + ' 「層」=' + /層/.test(webR));

/* 「曲を組み立てる」語彙が出力に入っているか（全ジャンル中のリズムだけ） */
const musicWord = (t)=> /レイヤー|重ね|楽器|メロディ|和音|奏で|コード進行/.test(t);
log('  リズム: WEB出力に音楽語=' + musicWord(webR) + ' Unity出力に音楽語=' + musicWord(PK2.prompts.promptUnity(PR)));

/* ---------- C. 快感の具体性（最初の3秒／山場） ---------- */
log('');
log('=== C. 快感の設計（kick / spike / again） ===');
const missKick=[], missSpike=[], missAgain=[];
PK2.GENRES.forEach(g=>{
  if(!g.kick || String(g.kick).trim().length<8) missKick.push(g.id);
  if(!g.spike || String(g.spike).trim().length<8) missSpike.push(g.id);
  if(!g.again || String(g.again).trim().length<8) missAgain.push(g.id);
});
log('KICK_MISSING=' + missKick.length + (missKick.length?' → '+missKick.join(','):''));
log('SPIKE_MISSING=' + missSpike.length + (missSpike.length?' → '+missSpike.join(','):''));
log('AGAIN_MISSING=' + missAgain.length + (missAgain.length?' → '+missAgain.join(','):''));

let pk=0;
PK2.GENRES.forEach(g=>{
  const P = PK2.plan.buildPlan({games:[], genre:g.id, hook:'h_pico', exp:'some', goal:'both'});
  if(P.kick && P.spike && P.again) pk++;
  const outs = [PK2.prompts.promptPlan(P), PK2.prompts.promptWeb(P), PK2.prompts.promptUnity(P)];
  // 出力に kick/spike の文字が入っているかは下でまとめて見る
});
log('PLAN_HAS_KICK_SPIKE_AGAIN=' + pk + ' / ' + PK2.GENRES.length);

/* 6出力に「最初の3秒」と「山場」が入っているか */
const word = {plan:0, image:0, assets:0, web:0, unity:0, proposal:0};
PK2.GENRES.forEach(g=>{
  const st = {games:['g_mario'], genre:g.id, hook:'h_pico', exp:'some', goal:'both'};
  const P = PK2.plan.buildPlan(st);
  const outs = {
    plan: PK2.prompts.promptPlan(P), image: PK2.prompts.promptImage(P),
    assets: PK2.prompts.promptAssets(P), web: PK2.prompts.promptWeb(P),
    unity: PK2.prompts.promptUnity(P), proposal: PK2.prompts.promptProposal(P, st)
  };
  Object.keys(outs).forEach(k=>{
    if(/最初の3秒/.test(outs[k]) || /山場/.test(outs[k])) word[k]++;
  });
});
log('KICKSPIKE_IN_OUTPUT=' + JSON.stringify(word) + ' (全' + PK2.GENRES.length + ')');

/* 出力の「同じ文」度：ジャンルを変えても出る定型文が同じでないか */
const st1 = {games:[], genre:'g_platx', hook:'h_pico', exp:'some', goal:'both'};
const st2 = {games:[], genre:'g_rhythm', hook:'h_pico', exp:'some', goal:'both'};
const w1 = PK2.prompts.promptWeb(PK2.plan.buildPlan(st1));
const w2 = PK2.prompts.promptWeb(PK2.plan.buildPlan(st2));
const s1 = new Set(w1.split('\n')); const s2 = w2.split('\n');
const common = s2.filter(l=>l.trim() && s1.has(l)).length;
log('WEB出力の共通行数(platx vs rhythm)=' + common + ' / rhythm側' + s2.filter(l=>l.trim()).length + '行');

/* ---------- D. 失敗検出 ---------- */
log('');
log('=== D. 出力の健全性 ===');
let bad=0;
PK2.GENRES.forEach(g=>{
  const P = PK2.plan.buildPlan({games:[], genre:g.id, hook:'h_pico', exp:'some', goal:'both'});
  const outs = [PK2.prompts.promptPlan(P), PK2.prompts.promptImage(P), PK2.prompts.promptAssets(P),
                PK2.prompts.promptWeb(P), PK2.prompts.promptUnity(P),
                PK2.prompts.promptProposal(P, {games:[]})];
  outs.forEach(v=>{ if(!v || v.indexOf('undefined')>=0 || /\bNaN\b/.test(v)) bad++; });
});
log('OUTPUT_BAD=' + bad);
log('DONE');
done();
});
</script>
</body></html>
